name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "false"
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      - run: pip install ruff pytest pytest-django bandit pip-audit
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest
      - name: bandit
        run: bandit -r apps integrations config -x "*/tests/*,*/migrations/*" -ll
      - name: pip-audit
        run: pip-audit -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: vitest
        run: npm test
      - name: build
        run: npm run build
      - name: npm audit
        run: npm audit --audit-level=high
