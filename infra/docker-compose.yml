# Lancement : docker compose -f infra/docker-compose.yml up --build  (depuis la racine du dépôt)
# Valeurs de démonstration uniquement : remplacer SECRET_KEY et POSTGRES_PASSWORD hors démonstration (fichier .env).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agridigit
      POSTGRES_USER: agridigit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agridigit-demo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agridigit -d agridigit"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgres://agridigit:${POSTGRES_PASSWORD:-agridigit-demo}@db:5432/agridigit
      SECRET_KEY: ${SECRET_KEY:-change-me-demo-only}
      DEBUG: "false"
      DEMO_MODE: ${DEMO_MODE:-true}
      ALLOWED_HOSTS: "api,localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/staticfiles
    expose:
      - "8000"

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    depends_on:
      - api
    volumes:
      - static:/usr/share/nginx/static:ro
    ports:
      - "8080:80"

volumes:
  pgdata:
  static:
